<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Streamer Editor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
<style>
/* Layout: left rail (desktop) / bottom tab bar (phone); content max 1200px; clip grid 5 columns on desktop, fewer on narrow screens */
:root{
  --bg:#F4F7FB;--surface:#FFFFFF;--ink:#14213D;--muted:#5B6B82;--line:#DDE4EE;--accent:#1F5FBF;--accent-ink:#FFFFFF;--accent-soft:#E6EEFB;--ok:#1E8E5A;--warn:#B7791F;--bad:#C0392B;--thumb1:#BFD4F5;--thumb2:#8FB2EA;--radius:10px;--head:'Poppins',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--sub:#38BDF8;
}
html[data-app-theme="green"]{--bg:#F4F7F4;--ink:#16291F;--muted:#586B5F;--line:#DCE6DE;--accent:#2B7A57;--accent-soft:#E2F1E9;--thumb1:#BDE0CD;--thumb2:#8CC4A7}
html[data-app-theme="gaming"]{--bg:#F1EEFF;--ink:#1D1640;--muted:#645C8A;--line:#DAD3F7;--accent:#7C3AED;--accent-soft:#EBE2FF;--thumb1:#C9B8F8;--thumb2:#67D6EA;--radius:14px}
html[data-app-theme="dark"]{--bg:#111214;--surface:#1A1B1E;--ink:#E8E9EB;--muted:#9B9EA6;--line:#2B2D32;--accent:#8AB4FF;--accent-ink:#0E1626;--accent-soft:#22262F;--ok:#4CC38A;--warn:#E0B04A;--bad:#F0786B;--thumb1:#2B3140;--thumb2:#3A4256;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:600}h2{font-size:17px;font-weight:600}h3{font-size:14px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:var(--radius);font-weight:500;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=email],input[type=password],input[type=url],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;min-height:42px}
label.f{display:grid;gap:5px;font-weight:500;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grow{flex:1 1 200px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.off{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
/* auth */
.brand{font-family:var(--head);font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.sep:before,.sep:after{content:"";flex:1;border-top:1px solid var(--line)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.acct{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.acct:hover{border-color:var(--accent)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;flex:none}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
/* shell */
.page{max-width:1280px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));min-height:100%}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}
.rail{position:sticky;top:16px;align-self:start;display:grid;gap:14px}
.nav{display:grid;gap:4px;align-content:start}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:var(--radius);color:var(--muted);font-weight:500;text-align:left}
.nav button[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.main{display:grid;gap:18px;align-content:start;min-width:0}
.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;padding:0;display:block;width:100%}
.clip[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.thumb{aspect-ratio:16/10;background:linear-gradient(135deg,var(--thumb1),var(--thumb2));position:relative}
.thumb .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px}
.thumb .sc{position:absolute;left:6px;top:6px}
.clip .meta{padding:8px 10px;display:grid;gap:2px}
.clip .ttl{font-weight:600;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.studio{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.stage{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:grid;place-items:center}
.screen{position:relative;max-width:100%;border-radius:8px;overflow:hidden;background:#0d1117;width:100%}
.screen .pic{position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,#4f8cff,transparent 55%),radial-gradient(circle at 75% 70%,#a259ff,transparent 55%),#1b2433}
.screen .cap{position:absolute;left:6%;right:6%;bottom:10%;text-align:center;font:600 clamp(13px,2.4vw,20px)/1.3 'Poppins',sans-serif;color:var(--sub);text-shadow:0 1px 3px rgba(0,0,0,.7)}
.screen .cap i{font-style:italic}
.screen .play{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#111;display:grid;place-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
.sl{display:grid;gap:4px}
.sl .top{display:flex;justify-content:space-between;font-size:13px;font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .2s}
.conn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.conn:first-child{border-top:0}
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tcard{border:2px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:8px;text-align:left;display:grid;gap:6px}
.tcard[aria-pressed=true]{border-color:var(--accent)}
.sw{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.1)}
.sw i{flex:1}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chk{display:flex;gap:10px;align-items:flex-start}
.chk input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.tab-bar{display:none}
@media (max-width:1000px){.grid5{grid-template-columns:repeat(3,minmax(0,1fr))}.studio{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{display:none}
  .main{padding-bottom:90px}
  .tab-bar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(66px,1fr);overflow-x:auto;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
  .tab-bar button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 2px}
  .tab-bar button[aria-current=page]{color:var(--accent)}
  .tab-bar svg{width:22px;height:22px}
  .grid5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.themes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .conn{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes sh{from{background-position:0 0}to{background-position:200% 0}}
.fxw{position:absolute;inset:0}
.ov{position:absolute;inset:0;pointer-events:none}
.ov.flash{background:#fff;opacity:0}
.ov.glitch{opacity:0;background:linear-gradient(transparent 20%,rgba(255,0,70,.35) 20% 26%,transparent 26% 52%,rgba(0,220,255,.35) 52% 57%,transparent 57% 80%,rgba(255,0,70,.3) 80% 84%,transparent 84%);mix-blend-mode:screen}
.ov.scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
.ov.grain{opacity:.16;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");mix-blend-mode:overlay}
.ov.box{background:linear-gradient(#000 0 9%,transparent 9% 91%,#000 91%)}
.callout{position:absolute;left:5%;top:9%;font:700 clamp(11px,2vw,16px) 'Poppins',sans-serif;letter-spacing:.12em;color:#fff;background:rgba(10,14,25,.65);border-left:3px solid var(--sub);padding:3px 10px;border-radius:3px}
.screen.playing .pic{animation:drift 6s ease-in-out infinite alternate}
.screen.playing.g-shake .fxw{animation:kshake 3s linear infinite}
.screen.playing.g-punch .pic{animation:kpunch 3s ease-out infinite}
.screen.playing.g-flash .ov.flash{animation:kflash 3s linear infinite}
.screen.playing.g-glitch .ov.glitch{animation:kglitch 3s steps(1) infinite}
@keyframes drift{to{transform:scale(1.05)}}
@keyframes kshake{0%,19%,31%,100%{transform:none}20%{transform:translate(calc(var(--sh)*-1px),calc(var(--sh)*.5px))}22%{transform:translate(calc(var(--sh)*1px),calc(var(--sh)*-.6px))}24%{transform:translate(calc(var(--sh)*-.7px),calc(var(--sh)*-.4px))}26%{transform:translate(calc(var(--sh)*.6px),calc(var(--sh)*.5px))}28%{transform:translate(calc(var(--sh)*-.3px),0)}}
@keyframes kpunch{0%,19%{transform:scale(1)}20%{transform:scale(calc(1 + var(--pz)))}34%,100%{transform:scale(1)}}
@keyframes kflash{0%,19%{opacity:0}20%{opacity:.55}30%,100%{opacity:0}}
@keyframes kglitch{0%,19%{opacity:0}20%{opacity:1;transform:translateX(-6px)}22%{opacity:.8;transform:translateX(7px)}24%{opacity:1;transform:translateX(-3px)}26%,100%{opacity:0;transform:none}}

/* ---- visual upgrade ---- */
a{color:var(--accent);font-weight:500}
#app{min-height:100%}
body{background:radial-gradient(900px 520px at 88% -8%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 62%),radial-gradient(700px 420px at -8% 18%,color-mix(in srgb,var(--thumb2) 28%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#7C3AED));box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 32%,transparent)}
.card{box-shadow:0 1px 2px rgba(20,33,61,.04),0 8px 24px rgba(20,33,61,.05)}
.clip{transition:transform .15s,box-shadow .15s}.clip:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(20,33,61,.12)}
.nav button[aria-current=page]{background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 60%,var(--surface)))}
.logo{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#38BDF8))}
.herocard{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 58%,#7C3AED));color:#fff;border:0;position:relative;overflow:hidden}
.herocard:before{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14)}
.herocard:after{content:"";position:absolute;right:70px;bottom:-90px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.09)}
.herocard>*{position:relative;z-index:1}
.herocard .ht{font-size:20px;color:#fff}.herocard .hs,.herocard .muted{color:rgba(255,255,255,.85)}
.herocard label.f{color:#fff}
.herocard .btn.primary{background:#fff;color:var(--accent);box-shadow:none}
html[data-app-theme="dark"] .herocard{background:linear-gradient(135deg,#27324A,#1A1B1E);border:1px solid var(--line);color:var(--ink)}
html[data-app-theme="dark"] .herocard .ht,html[data-app-theme="dark"] .herocard label.f{color:var(--ink)}
html[data-app-theme="dark"] .herocard .hs,html[data-app-theme="dark"] .herocard .muted{color:var(--muted)}
html[data-app-theme="dark"] .herocard .btn.primary{background:var(--accent);color:var(--accent-ink)}
/* password eye */
.pw{position:relative;display:block;width:100%}
.pw input{padding-right:48px!important}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:38px;height:38px;display:grid;place-items:center;color:var(--muted);border-radius:8px;padding:0}
.eye:hover{color:var(--accent);background:var(--accent-soft)}
.eye svg{width:20px;height:20px}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-hero{position:relative;overflow:hidden;color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 78%,#0B1030),var(--accent) 52%,var(--thumb2))}
html[data-app-theme="dark"] .auth-hero{background:linear-gradient(145deg,#141A2B,#26324E 55%,#31507F);color:#E8E9EB}
.auth-hero:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-120px;top:-120px;background:rgba(255,255,255,.12)}
.auth-hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;left:-90px;bottom:-100px;background:rgba(255,255,255,.09)}
.auth-hero>*{position:relative;z-index:1}
.auth-hero .brand{color:#fff}
.auth-hero h2{font-size:32px;line-height:1.2;font-weight:700;max-width:14em}
.auth-hero p{margin:14px 0 0;opacity:.88;max-width:30em;font-size:15px}
.auth-hero ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.auth-hero li{display:flex;gap:10px;align-items:center;font-weight:500}
.auth-hero li i{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-style:normal;font-size:12px}
.mock{position:relative;height:200px;margin-top:30px}
.mc{position:absolute;width:190px;aspect-ratio:16/10;border-radius:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);backdrop-filter:blur(8px);animation:float 6s ease-in-out infinite;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:7px}
.mc:before{content:"";position:absolute;inset:0;margin:auto;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92)}
.mc:after{content:"";position:absolute;left:50%;top:50%;margin:-8px 0 0 -5px;border-left:14px solid var(--accent);border-top:8px solid transparent;border-bottom:8px solid transparent;transform:translateX(0)}
.mc em{position:absolute;left:10px;top:10px;font:700 10px/1 'Poppins',sans-serif;letter-spacing:.1em;background:rgba(255,255,255,.92);color:var(--accent);border-radius:99px;padding:4px 8px}
.mc b{display:block;height:6px;border-radius:99px;background:rgba(255,255,255,.75);width:72%}.mc b.s{width:42%;opacity:.6}
.m1{left:0;top:30px}.m2{left:150px;top:0;animation-delay:-2s}.m3{left:300px;top:60px;animation-delay:-4s}
@keyframes float{50%{transform:translateY(-10px)}}
.auth-form{display:flex;align-items:center;justify-content:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.auth-box{width:100%;max-width:420px;display:grid;gap:16px}
.auth-box .card{padding:24px;box-shadow:0 18px 48px rgba(20,33,61,.12)}
@media (max-width:860px){
 .auth{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
 .auth-hero{padding:22px max(18px,env(safe-area-inset-right,0px)) 26px max(18px,env(safe-area-inset-left,0px));gap:14px}
 .auth-hero .mock,.auth-hero ul,.auth-hero p{display:none}
 .auth-hero h2{font-size:21px}
 .auth-form{align-items:flex-start;padding-top:24px}
}
@media (prefers-reduced-motion:reduce){.mc{animation:none}}

/* ---- layout v2: banner, page title, boxed rail ---- */
.banner{position:relative;overflow:hidden;border-radius:20px;padding:26px 20px;text-align:center;color:#fff;display:grid;justify-items:center;gap:6px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 80%,#0B1030),var(--accent) 55%,var(--thumb2));box-shadow:0 14px 34px color-mix(in srgb,var(--accent) 30%,transparent)}
html[data-app-theme="dark"] .banner{background:linear-gradient(120deg,#141A2B,#26324E 55%,#31507F);color:#E8E9EB;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.banner:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-70px;top:-110px;background:rgba(255,255,255,.13)}
.banner:after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;left:-60px;bottom:-110px;background:rgba(255,255,255,.09)}
.banner>*{position:relative;z-index:1}
.banner .brand{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:12px;white-space:nowrap;color:#fff;font-size:26px;letter-spacing:-.01em}
html[data-app-theme="dark"] .banner .brand{color:#fff}
.banner .logo{width:40px;height:40px;border-radius:12px;font-size:15px;background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(4px)}
.btag{font-size:13px;opacity:.88}
.pagehead{display:flex;justify-content:center;margin:20px 0 18px}
.pagehead span{display:inline-flex;align-items:center;gap:10px;padding:9px 28px;border:2px solid color-mix(in srgb,var(--c) 45%,var(--line));border-radius:99px;background:var(--surface);color:var(--c);font:600 19px/1.2 var(--head);box-shadow:0 6px 18px color-mix(in srgb,var(--c) 14%,transparent)}
.pagehead svg{width:22px;height:22px}
.main>.head>h1{display:none}
.main>.head:has(>h1:only-child){display:none}
.rail.card{padding:14px;border:1px solid var(--line)}
.rlab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 8px 6px}
.nav{gap:6px}
.nav button{width:100%;padding:8px 10px;border:1px solid transparent}
.nav button:hover{background:color-mix(in srgb,var(--c) 8%,transparent)}
.nav button[aria-current=page]{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 15%,var(--surface)),color-mix(in srgb,var(--c) 6%,var(--surface)));color:var(--c);border-color:color-mix(in srgb,var(--c) 30%,var(--line));box-shadow:none}
.ni{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);flex:none}
.nav button[aria-current=page] .ni{background:var(--c);color:#fff}
html[data-app-theme="dark"] .nav button[aria-current=page] .ni{color:#0E1626}
.racct{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:12px 6px 2px;min-width:0}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;flex:none}
.tab-bar button[aria-current=page]{color:var(--c)}
@media (max-width:760px){
 .page{padding-top:12px}
 .banner{padding:18px 14px;border-radius:16px}
 .banner .brand{font-size:21px}.banner .logo{width:34px;height:34px;font-size:13px}
 .pagehead{margin:16px 0 14px}.pagehead span{font-size:17px;padding:8px 22px}
}

/* ---- admin-configurable content ---- */
html.cfgbg .banner,html.cfgbg .auth-hero{background:var(--bgr)!important}
.cb{display:grid;gap:12px}
.cb-h{font-size:19px}.cb-t{margin:0;line-height:1.6}
.cb-img{max-width:100%;border-radius:14px;display:block}
.cb-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.cb-stat b{display:block;font:600 26px/1.2 var(--head);color:var(--c)}
.cb-call{border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));padding:12px 16px;border-radius:10px}
.cform{display:grid;gap:12px;padding:14px 0 8px;margin-top:10px;border-top:1px solid var(--line)}
.pick{border:1px dashed var(--line);border-radius:var(--radius);padding:4px 14px;margin-top:12px}

/* ---- authorize modal + limit alerts ---- */
.modal{position:fixed;inset:0;background:rgba(10,16,30,.55);display:grid;place-items:center;padding:16px;z-index:50}
.mbox{background:var(--surface);color:var(--ink);border-radius:20px;max-width:420px;width:100%;padding:24px;display:grid;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:92vh;overflow:auto}
.mlogos{display:flex;align-items:center;justify-content:center;gap:14px}
.mlogo{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font:700 22px var(--head);color:#fff;overflow:hidden;background:var(--ml,var(--accent));flex:none}
.mlogo.app{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#38BDF8))}
.mlogo.sm{width:40px;height:40px;border-radius:12px;font-size:16px}
.mlogo img{width:100%;height:100%;object-fit:cover}
.mlink{color:var(--muted);font-size:22px}
.who2{display:flex;gap:12px;align-items:center;min-width:0}
.alert-red{border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 10%,var(--surface));color:var(--bad);border-radius:var(--radius);padding:12px 14px;font-weight:500}
.alert-red .upg{color:var(--bad);text-decoration:underline;white-space:nowrap}
</style>

<body>
<div id="app"></div>
<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script>
(function(){
var L=window.SE_SHARED.L;
var S={lang:"en",theme:"blue",users:{},last:"",session:"",view:"clips",mode:"short",gpre:"esports",gint:5,gfx:{shake:true,punch:true,glitch:false,flash:true,scan:false,grain:false,box:false,call:true},auth:"login",tmp:null,
 clips:[],shown:25,sel:{},cur:null,ratio:"16:9",fx:{bright:100,contrast:100,sat:100,warm:0,glow:0,vig:0},preset:"none",
 sfx:{whoosh:true,hit:true,riser:false,pop:false,bass:false,ping:true},opts:{duck:true,loud:true,hook:true,shake:false,trans:true,caps:true,silence:true},
 tab:"light",res:"1080p",fps:60,mcp:{},usage:{},plat:{},post:{cap:"",when:"now"},postedM:3,keys:{anth:"",hf:""},msg:""};
var KEY="se_v1";
var FB_ON=!!(window.FIREBASE_CONFIG&&!/^PASTE/.test(window.FIREBASE_CONFIG.apiKey||"PASTE"));
var FB=function(){return window.SE_FB};
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||"{}");for(var k in d)S[k]=d[k];}catch(e){}}
var saveT;
function cloudSave(){if(!FB_ON||!S.session||!FB())return;clearTimeout(saveT);saveT=setTimeout(function(){FB().saveSettings({theme:S.theme,lang:S.lang,mcp:S.mcp,usage:S.usage,keys:S.keys,res:S.res,fps:S.fps}).catch(function(){})},600)}
function save(){cloudSave();try{localStorage.setItem(KEY,JSON.stringify(FB_ON?{lang:S.lang,theme:S.theme,last:S.last}:{lang:S.lang,theme:S.theme,users:S.users,last:S.last,session:S.session,mcp:S.mcp,usage:S.usage,keys:S.keys,res:S.res,fps:S.fps}));}catch(e){}}
var CFG=null;try{CFG=JSON.parse(localStorage.getItem("se_cfg")||"null")}catch(e){}
function L10(o){return o?(o[S.lang]||o.en||""):""}
function t(k){var o=CFG&&CFG.texts&&CFG.texts[S.lang]&&CFG.texts[S.lang][k];return o||(L[S.lang]&&L[S.lang][k])||L.en[k]||k}
function BN(){return (CFG&&CFG.brand&&CFG.brand.name)||t("app")}
function LG(){return esc((CFG&&CFG.brand&&CFG.brand.logo)||"SE")}
function TAG(){return L10(CFG&&CFG.banner&&CFG.banner.tagline)||t("bannerTag")}
function safeUrl(u){return /^https:\/\/[^\s"'()<>]+$/.test(u||"")?u:""}
var HEX=/^#[0-9a-fA-F]{6}$/;
function applyCfg(){var r=document.documentElement,b=(CFG&&CFG.banner)||{},g="";
 if(HEX.test(b.c1||"")&&HEX.test(b.c2||""))g="linear-gradient(120deg,"+b.c1+","+b.c2+")";
 var im=safeUrl(b.image);if(im)g='linear-gradient(120deg,rgba(0,0,0,.45),rgba(0,0,0,.2)),url("'+im+'") center/cover';
 if(g){r.style.setProperty("--bgr",g);r.classList.add("cfgbg")}else{r.style.removeProperty("--bgr");r.classList.remove("cfgbg")}
 document.title=(CFG&&CFG.brand&&CFG.brand.name)||"Streamer Editor"}
var BUILTIN=["clips","studio","post","settings"];
var DEF_COL={clips:"var(--accent)",studio:"color-mix(in srgb,var(--accent) 50%,#7C3AED)",post:"color-mix(in srgb,var(--accent) 45%,#0EA5A5)",settings:"color-mix(in srgb,var(--accent) 40%,#64748B)"};
var TKEY={clips:"nClips",studio:"nStudio",post:"nPost",settings:"nSettings"};
function pages(){
 var list=(CFG&&CFG.pages&&CFG.pages.length)?CFG.pages.slice():[];
 BUILTIN.forEach(function(k){if(!list.some(function(p){return p.id===k}))list.push({id:k})});
 return list.filter(function(p){return p.id==="settings"||!p.hidden}).map(function(p){var b=BUILTIN.indexOf(p.id)>-1;
  var c=HEX.test(p.color||"")?p.color:(b?DEF_COL[p.id]:"var(--accent)");
  return {id:p.id,builtin:b,title:L10(p.title)||(b?t(TKEY[p.id]):"Page"),icon:(p.icon&&ICON[p.icon])||(b?ICON[p.id]:ICON.star),color:c,blocks:p.blocks||[]}})}
function pageOf(id){var l=pages();return l.filter(function(p){return p.id===id})[0]||l[0]}
function catalog(){return ((CFG&&Array.isArray(CFG.mcps))?CFG.mcps:window.SE_SHARED.MCPS).filter(function(m){return m.enabled!==false&&m.id})}
function blocksHtml(bl){if(!bl||!bl.length)return"";var h='<div class="cb">',i=0;
 while(i<bl.length){var b=bl[i];
  if(b.type==="stat"){h+='<div class="cb-stats">';while(i<bl.length&&bl[i].type==="stat"){h+='<div class="card cb-stat"><span class="muted small">'+esc(L10(bl[i].label))+'</span><b>'+esc(bl[i].value||"")+'</b></div>';i++}h+='</div>';continue}
  if(b.type==="heading")h+='<h2 class="cb-h">'+esc(L10(b.text))+'</h2>';
  else if(b.type==="text")h+='<p class="cb-t">'+esc(L10(b.text)).replace(/\n/g,"<br>")+'</p>';
  else if(b.type==="image"&&safeUrl(b.url))h+='<img class="cb-img" src="'+esc(safeUrl(b.url))+'" alt="'+esc(b.alt||"")+'">';
  else if(b.type==="button"&&safeUrl(b.url))h+='<div><a class="btn primary" href="'+esc(safeUrl(b.url))+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">'+esc(L10(b.label))+'</a></div>';
  else if(b.type==="callout")h+='<div class="cb-call">'+esc(L10(b.text)).replace(/\n/g,"<br>")+'</div>';
  i++}
 return h+'</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var $=function(s,r){return (r||document).querySelector(s)};
var app=$("#app");
var ICON=window.SE_SHARED.ICONS;
var G='<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.3 5.7c4.3-4 6.7-9.9 6.7-17.4z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 010-9.4l-7.9-6.1a24 24 0 000 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.9 2.3-8.6 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';

/* ---------- auth ---------- */
function heroHtml(){return '<div class="auth-hero"><div class="brand"><span class="logo">'+LG()+'</span>'+esc(BN())+'</div><div><h2>'+t("authHead")+'</h2><p>'+t("authSub")+'</p><div class="mock" aria-hidden="true"><div class="mc m1"><em>HOOK</em><b></b><b class="s"></b></div><div class="mc m2"><em>HOOK</em><b></b><b class="s"></b></div><div class="mc m3"><em>HOOK</em><b></b><b class="s"></b></div></div></div><ul><li><i>✓</i>'+t("v1")+'</li><li><i>✓</i>'+t("v2")+'</li><li><i>✓</i>'+t("v3")+'</li></ul></div>'}
function authView(){
 var a=S.auth,h='<div class="auth">'+heroHtml()+'<div class="auth-form"><div class="auth-box">';
 if(a==="login"){
  var known=S.last&&(FB_ON||S.users[S.last]);
  h+='<div class="card stack"><h1>'+(known?t("welcomeBack"):t("login"))+'</h1>';
  if(known){h+='<div class="acct" style="cursor:default"><span class="avatar">'+esc(S.last[0].toUpperCase())+'</span><span style="min-width:0"><b>'+esc(S.last)+'</b></span></div><input type="hidden" id="em" value="'+esc(S.last)+'">';}
  else h+='<label class="f">'+t("email")+'<input id="em" type="email" autocomplete="email"></label>';
  h+='<label class="f">'+t("pw")+'<input id="pw" type="password" autocomplete="current-password"></label><div class="err" id="err">'+(window.SE_note?t("accDisabled"):"")+'</div><button class="btn primary block" id="go">'+t("login")+'</button>';
  if(known)h+='<button class="btn block" id="other">'+t("other")+'</button>';
  h+='<div class="sep">'+t("or")+'</div><button class="btn block gbtn" id="g">'+G+t("google")+'</button></div><div class="small muted" style="text-align:center">'+t("noacct")+' <a href="#" id="toReg">'+t("register")+'</a></div>';
 }else if(a==="register"){
  h+='<div class="card stack"><h1>'+t("register")+'</h1><label class="f">'+t("email")+'<input id="em" type="email" autocomplete="email"></label><label class="f">'+t("pw")+'<input id="pw" type="password" autocomplete="new-password"></label><label class="f">'+t("pw2")+'<input id="pw2" type="password" autocomplete="new-password"></label><div class="err" id="err">'+(window.SE_note?t("accDisabled"):"")+'</div><button class="btn primary block" id="go">'+t("register")+'</button><div class="sep">'+t("or")+'</div><button class="btn block gbtn" id="g">'+G+t("google")+'</button></div><div class="small muted" style="text-align:center">'+t("haveacct")+' <a href="#" id="toLog">'+t("login")+'</a></div>';
 }else if(a==="pick"){
  var em=["geniusdigitaldeveloper@gmail.com","streamer.demo@gmail.com"];
  h+='<div class="card stack"><h1>'+t("pick")+'</h1><div class="muted">'+t("pickSub")+'</div>';
  em.forEach(function(e){h+='<button class="acct" data-pick="'+esc(e)+'"><span class="avatar">'+esc(e[0].toUpperCase())+'</span><span style="min-width:0">'+esc(e)+'</span></button>'});
  h+='<button class="btn block" id="toReg">←</button></div>';
 }else if(a==="newpw"){
  h+='<div class="stack"><div class="toast"><span>✉</span><div><b>'+t("notif")+' '+esc(S.tmp)+'</b><div class="small muted">'+t("notifSub")+'</div></div></div><div class="card stack"><h2>'+t("newpw")+'</h2><label class="f">'+t("pw")+'<input id="pw" type="password" autocomplete="new-password"></label><label class="f">'+t("pw2")+'<input id="pw2" type="password" autocomplete="new-password"></label><div class="err" id="err">'+(window.SE_note?t("accDisabled"):"")+'</div><button class="btn primary block" id="go">'+t("cont")+'</button></div></div>';
 }
 return h+'</div></div></div>';
}
function bindAuth(){
 var g=function(id){return document.getElementById(id)};
 var on=function(id,fn){var e=g(id);if(e)e.onclick=function(ev){ev.preventDefault();fn()}};
 on("toReg",function(){S.auth="register";render()});on("toLog",function(){S.auth="login";render()});
 on("other",function(){S.last="";save();render()});
 on("g",function(){
  if(!FB_ON){S.auth="pick";render();return}
  if(!FB())return;
  window.SE_pending=true;
  FB().google().then(function(r){window.SE_pending=false;
    if(r.needsPassword){S.tmp=r.email;S.auth="newpw";render()}else{S.session=r.email;S.last=r.email;save();enter()}
  }).catch(function(){window.SE_pending=false;var er=document.getElementById("err");if(er)er.textContent=t("wrong")});
 });
 document.querySelectorAll("[data-pick]").forEach(function(b){b.onclick=function(){S.tmp=b.dataset.pick;S.auth="newpw";render()}});
 var go=g("go");if(!go)return;
 var act=function(){
  var er=g("err"),em=g("em")&&g("em").value.trim().toLowerCase(),pw=g("pw").value,p2=g("pw2")&&g("pw2").value;
  if(FB_ON){
   if(!FB()){er.textContent="…";return}
   var fail=function(e){var c=(e&&e.code)||"";er.textContent=c==="auth/email-already-in-use"?t("exists"):c==="auth/weak-password"?t("short"):c==="auth/invalid-email"?t("bademail"):t("wrong")};
   if(S.auth==="login"){FB().login(em,pw).then(function(){S.last=em;save()}).catch(fail);return}
   if(S.auth==="register"){if(pw.length<8){er.textContent=t("short");return}if(pw!==p2){er.textContent=t("mismatch");return}FB().register(em,pw).then(function(){S.last=em;save()}).catch(fail);return}
   if(S.auth==="newpw"){if(pw.length<8){er.textContent=t("short");return}if(pw!==p2){er.textContent=t("mismatch");return}FB().setPassword(pw).then(function(){S.session=S.tmp;S.last=S.tmp;save();enter()}).catch(fail);return}
  }
  if(S.auth==="login"){var u=S.users[em];if(!u||u.pw!==pw){er.textContent=t("wrong");return}S.session=em;S.last=em;save();enter();return}
  if(S.auth==="register"){if(!/^\S+@\S+\.\S+$/.test(em)){er.textContent=t("bademail");return}if(S.users[em]){er.textContent=t("exists");return}}
  if(pw.length<8){er.textContent=t("short");return}
  if(pw!==p2){er.textContent=t("mismatch");return}
  if(S.auth==="newpw")em=S.tmp;
  S.users[em]={pw:pw};S.session=em;S.last=em;save();enter();
 };
 go.onclick=act;
 document.querySelectorAll(".auth input").forEach(function(i){i.onkeydown=function(e){if(e.key==="Enter")act()}});
}
function enter(){S.view="clips";render()}

/* ---------- app ---------- */
function mk(n){var o=[];for(var i=0;i<n;i++)o.push({id:i,title:t("clipN")+" "+(i+1),score:null,dur:null,at:null});return o}
function fmt(s){var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x}
function nav(rail,pg){return pages().map(function(p){return '<button data-nav="'+esc(p.id)+'" style="--c:'+p.color+'"'+(pg.id===p.id?' aria-current="page"':'')+'>'+(rail?'<span class="ni">'+p.icon+'</span>':p.icon)+'<span>'+esc(p.title)+'</span></button>'}).join("")}
function shell(body,pg){
 return '<div class="page" style="--c:'+pg.color+'"><header class="banner"><div class="brand"><span class="logo">'+LG()+'</span><span class="bname">'+esc(BN())+'</span></div><div class="btag">'+esc(TAG())+'</div></header>'+
 '<div class="pagehead"><span>'+pg.icon+esc(pg.title)+'</span></div>'+
 '<div class="shell"><aside class="rail card"><div class="rlab">'+t("menu")+'</div><nav class="nav">'+nav(true,pg)+'</nav><div class="racct"><span class="av">'+esc((S.session||"?")[0].toUpperCase())+'</span><span class="small muted" style="min-width:0;overflow:hidden;text-overflow:ellipsis">'+esc(S.session)+'</span></div></aside><main class="main">'+body+'</main></div></div><nav class="tab-bar">'+nav(false,pg)+'</nav>'}

function clipsView(){
 var h='<div class="head"><h1>'+t("nClips")+'</h1></div><div class="card stack herocard"><div><h2 class="ht">'+t("heroT")+'</h2><div class="hs">'+t("heroS")+'</div></div><label class="f">'+t("src")+'<div class="row"><input class="grow" id="url" type="url" placeholder="https://www.youtube.com/live/..." value="https://www.youtube.com/live/demo-stream" style="flex:1 1 220px"><button class="btn primary" id="an">'+t("analyze")+'</button></div></label><div class="small muted">'+t("srcHint")+'</div><div class="bar" id="pbar" hidden><div></div></div><div class="small" id="jstat">'+esc(S.jobMsg||"")+'</div><div class="small muted">'+t("demo")+'</div></div><div class="card stack"><div class="seg"><button data-mode="short" aria-pressed="'+(S.mode==="short")+'">'+t("modeShort")+'</button><button data-mode="long" aria-pressed="'+(S.mode==="long")+'">'+t("modeLong")+'</button></div><div class="small muted">'+t(S.mode==="long"?"hintLong":"hintShort")+'</div></div>';
 if(!S.clips.length)return h+'<div class="card muted">'+t("none")+'</div>';
 var n=Object.keys(S.sel).length;
 h+='<div class="head"><h2>'+(S.mode==="long"?t("modeLong"):t("tplHead"))+' <span class="pill">'+t("sel")+': '+n+'</span></h2><button class="btn primary" id="toStudio"'+(S.cur===null?' disabled':'')+'>'+t("edit")+'</button></div><div class="grid5">';
 S.clips.slice(0,S.shown).forEach(function(c){
  h+='<div class="clip" role="group"><button class="clip" style="border:0" data-clip="'+c.id+'" aria-pressed="'+(S.cur===c.id)+'"><div class="thumb">'+(c.score!=null?'<span class="pill sc">'+t("hook")+' '+c.score+'</span>':'')+(c.dur!=null?'<span class="dur">'+fmt(c.dur)+'</span>':'')+'</div></button><div class="meta"><div class="ttl">'+esc(c.title)+'</div><label class="chk small muted"><input type="checkbox" data-sel="'+c.id+'"'+(S.sel[c.id]?' checked':'')+'>'+(c.at!=null?fmt(c.at)+' · ':'')+t("sel")+'</label></div></div>';
 });
 h+='</div>';
 if(S.shown<S.clips.length)h+='<button class="btn" id="more">'+t("showMore")+'</button>';
 return h;
}
function bindClips(){
 document.querySelectorAll("[data-mode]").forEach(function(b){b.onclick=function(){S.mode=b.dataset.mode;render()}});
 var an=$("#an");if(an&&FB_ON&&FB())an.onclick=function(){
  an.disabled=true;an.textContent=t("analyzing")+"…";S.clips=[];S.sel={};S.cur=null;
  FB().startJob($("#url").value.trim(),S.mode,function(j){
   if(!j)return;
   var m={queued:"jobQueued",fetching_captions:"jobCaps",finding_hooks:"jobHooks",done:"jobDone",no_captions:"jobNoCaps"}[j.msg];
   S.jobMsg=j.status==="error"?(j.msg==="no_captions"?t("jobNoCaps"):t("jobErr")):(m?t(m):"");
   if(j.status==="done"){S.clips=j.clips||[];S.shown=25;S.cur=S.clips.length?0:null;if(!S.clips.length)S.jobMsg=t("jobNone")}
   if(S.view==="clips")render();
  }).catch(function(){S.jobMsg=t("jobErr");render()});
 };
 else if(an)an.onclick=function(){
  var b=$("#pbar");b.hidden=false;var f=b.firstChild,p=0;an.disabled=true;an.textContent=t("analyzing")+"…";
  var iv=setInterval(function(){p+=8+Math.random()*10;f.style.width=Math.min(p,100)+"%";if(p>=100){clearInterval(iv);S.clips=mk(10);S.shown=25;S.sel={};S.cur=0;render()}},160);
 };
 document.querySelectorAll("[data-clip]").forEach(function(b){b.onclick=function(){S.cur=+b.dataset.clip;S.view="studio";render()}});
 document.querySelectorAll("[data-sel]").forEach(function(b){b.onchange=function(){if(b.checked)S.sel[b.dataset.sel]=1;else delete S.sel[b.dataset.sel];render()}});
 var m=$("#more");if(m)m.onclick=function(){S.shown+=25;render()};

  S.mcp[m.id]=Object.assign({},S.mcp[m.id],{on:true,pending:false,mode:"key",key:k});S.authFor=null;S.mKey=false;save();render()}}

 var pill=o.on?(o.mode==="oauth"?'<span class="pill ok">'+t("connected")+'</span>':'<span class="pill ok">'+t("keySaved")+'</span>'):(o.pending?'<span class="pill off">'+t("waiting")+'</span>':'<span class="pill off">—</span>');
 var sub=o.on&&o.mode==="oauth"?'<div class="small muted">'+t("freeBadge")+(limitText(m)?' · '+esc(limitText(m)):'')+'</div>':(o.on&&o.mode==="key"&&!o.custom?'<div class="small muted">'+t("paidBadge")+'</div>':'');
 return '<div class="conn" style="align-items:center"><div class="who2">'+logoHtml(m).replace('class="mlogo"','class="mlogo sm"')+'<div style="min-width:0"><b>'+esc(m.name)+'</b> '+pill+'<div class="small muted">'+esc(L10(m.desc))+'</div>'+sub+'</div></div><div class="row" style="flex-wrap:nowrap"><button class="btn'+(o.on?'':' primary')+'" data-conn="'+id+'">'+(o.on?t("disconnect"):t("connect"))+'</button><button class="btn" data-rm="'+id+'" aria-label="'+t("remove")+'">✕</button></div></div>'}
function bindSet(){
 document.querySelectorAll("[data-theme]").forEach(function(b){b.onclick=function(){S.theme=b.dataset.theme;save();render()}});
 $("#lang").onchange=function(e){S.lang=e.target.value;save();render()};
 $("#addMcp").onclick=function(){S.mcpPick=!S.mcpPick;render()};
 ["name","url","key"].forEach(function(k){var e=$("#cm_"+k);if(e)e.oninput=function(){S.cm[k]=e.value}});
 var ck=$("#cm_kind");if(ck)ck.onchange=function(){S.cm.kind=ck.value};
 var ca=$("#cm_add");if(ca)ca.onclick=function(){var c=S.cm,er=$("#cm_err");
  if(!c.name.trim()){er.textContent=t("errName");return}
  if(!safeUrl(c.url.trim())){er.textContent=t("errLink");return}
  if(!c.key.trim()){er.textContent=t("keyReq");return}
  S.mcp["c_"+Date.now().toString(36)]={custom:true,name:c.name.trim(),url:c.url.trim(),key:c.key.trim(),kind:c.kind,on:true};
  S.cm=null;S.mcpPick=false;save();render()};
 document.querySelectorAll("[data-add]").forEach(function(b){b.onclick=function(){S.authFor=b.dataset.add;S.mKey=false;S.mcpPick=false;render()}});
 document.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){delete S.mcp[b.dataset.rm];save();render()}});
 document.querySelectorAll("[data-conn]").forEach(function(b){b.onclick=function(){var o=S.mcp[b.dataset.conn];
  if(o.on){o.on=false;o.pending=false;save();render()}else{S.authFor=b.dataset.conn;S.mKey=false;render()}}});
 $("#ksave").onclick=function(){S.keys.anth=$("#k_anth").value;S.keys.hf=$("#k_hf").value;save();this.textContent="✓ "+t("saved")};
 $("#out").onclick=function(){S.session="";S.auth="login";save();if(FB_ON&&FB())FB().logout();render()};
}

var EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYEOFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10.7 10.7 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4M6.5 6.5C3.8 8.3 2 12 2 12s3.6 7 10 7a10 10 0 004.5-1.1M9.9 9.9a3 3 0 004.2 4.2"/></svg>';
function enhancePw(){document.querySelectorAll('input[type=password]').forEach(function(i){
 if(i.parentNode.classList.contains("pw"))return;
 var w=document.createElement("span");w.className="pw";i.parentNode.insertBefore(w,i);w.appendChild(i);
 var b=document.createElement("button");b.type="button";b.className="eye";b.setAttribute("aria-label","Show password");b.innerHTML=EYE;
 b.onclick=function(){var show=i.type==="password";i.type=show?"text":"password";b.innerHTML=show?EYEOFF:EYE;b.setAttribute("aria-label",show?"Hide password":"Show password")};
 w.appendChild(b)})}
function render(){
 var th=S.theme==="blue"?"":S.theme;
 if(th)document.documentElement.setAttribute("data-app-theme",th);else document.documentElement.removeAttribute("data-app-theme");
 document.documentElement.lang=S.lang==="ms"?"ms":"en";
 if(!S.session){app.innerHTML=authView();bindAuth();enhancePw();return}
 var pg=pageOf(S.view),v=pg.id;S.view=v;
 var body=pg.builtin?blocksHtml(pg.blocks)+(v==="clips"?clipsView():v==="studio"?studioView():v==="post"?postView():setView()):(blocksHtml(pg.blocks)||'<div class="card muted">'+t("pageEmpty")+'</div>');
 app.innerHTML=shell(body,pg);
 document.querySelectorAll("[data-nav]").forEach(function(x){x.onclick=function(){S.view=x.dataset.nav;S.msg="";render();window.scrollTo(0,0)}});
 if(pg.builtin)(v==="clips"?bindClips:v==="studio"?bindStudio:v==="post"?bindPost:bindSet)();
 if(S.authFor){app.insertAdjacentHTML("beforeend",modalHtml());bindModal()}
 enhancePw();
}
load();applyCfg();
window.SE_onConfig=function(c){CFG=c||null;try{localStorage.setItem("se_cfg",JSON.stringify(CFG))}catch(e){}applyCfg();render()};
if(FB_ON){S.session="";S.users={}}else if(S.session&&!S.users[S.session])S.session="";
/* called by firebase.js when auth state changes */
window.SE_onUser=function(u,cfg){
  if(window.SE_pending)return;
  if(!u){S.session="";S.auth="login";render();return}
  window.SE_note="";
  if(cfg){["theme","lang","mcp","usage","keys","res","fps"].forEach(function(k){if(cfg[k]!==undefined)S[k]=cfg[k]})}
  S.session=u.email;S.last=u.email;try{localStorage.setItem(KEY,JSON.stringify({lang:S.lang,theme:S.theme,last:S.last}))}catch(e){}
  if(S.auth!=="newpw")enter();
};
render();
})();
