<style>
/* Layout: left rail (desktop) / bottom tab bar (phone); content max 1200px; clip grid 5 columns on desktop, fewer on narrow screens */
:root{
  --bg:#F4F7FB;--surface:#FFFFFF;--ink:#14213D;--muted:#5B6B82;--line:#DDE4EE;--accent:#1F5FBF;--accent-ink:#FFFFFF;--accent-soft:#E6EEFB;--ok:#1E8E5A;--warn:#B7791F;--bad:#C0392B;--thumb1:#BFD4F5;--thumb2:#8FB2EA;--radius:10px;--head:'Poppins',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--sub:#38BDF8;
}
html[data-app-theme="green"]{--bg:#F4F7F4;--ink:#16291F;--muted:#586B5F;--line:#DCE6DE;--accent:#2B7A57;--accent-soft:#E2F1E9;--thumb1:#BDE0CD;--thumb2:#8CC4A7}
html[data-app-theme="gaming"]{--bg:#F1EEFF;--ink:#1D1640;--muted:#645C8A;--line:#DAD3F7;--accent:#7C3AED;--accent-soft:#EBE2FF;--thumb1:#C9B8F8;--thumb2:#67D6EA;--radius:14px}
html[data-app-theme="dark"]{--bg:#111214;--surface:#1A1B1E;--ink:#E8E9EB;--muted:#9B9EA6;--line:#2B2D32;--accent:#8AB4FF;--accent-ink:#0E1626;--accent-soft:#22262F;--ok:#4CC38A;--warn:#E0B04A;--bad:#F0786B;--thumb1:#2B3140;--thumb2:#3A4256;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:600}h2{font-size:17px;font-weight:600}h3{font-size:14px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:var(--radius);font-weight:500;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=time],input[type=date],input[type=datetime-local],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;min-height:42px}
label.f{display:grid;gap:5px;font-weight:500;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grow{flex:1 1 200px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.off{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
/* auth */
.brand{font-family:var(--head);font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.sep:before,.sep:after{content:"";flex:1;border-top:1px solid var(--line)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.acct{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.acct:hover{border-color:var(--accent)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;flex:none}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
/* shell */
.page{max-width:1280px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));min-height:100%}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}
.rail{position:sticky;top:16px;align-self:start;display:grid;gap:14px}
.nav{display:grid;gap:4px;align-content:start}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:var(--radius);color:var(--muted);font-weight:500;text-align:left}
.nav button[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.main{display:grid;gap:18px;align-content:start;min-width:0}
.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;padding:0;display:block;width:100%}
.clip[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.thumb{aspect-ratio:16/10;background:linear-gradient(135deg,var(--thumb1),var(--thumb2));position:relative}
.thumb .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px}
.thumb .sc{position:absolute;left:6px;top:6px}
.clip .meta{padding:8px 10px;display:grid;gap:2px}
.clip .ttl{font-weight:600;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.studio{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.stage{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:grid;place-items:center}
.screen{position:relative;max-width:100%;border-radius:8px;overflow:hidden;background:#0d1117;width:100%}
.screen .pic{position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,#4f8cff,transparent 55%),radial-gradient(circle at 75% 70%,#a259ff,transparent 55%),#1b2433}
.screen .cap{position:absolute;left:6%;right:6%;bottom:10%;text-align:center;font:600 clamp(13px,2.4vw,20px)/1.3 'Poppins',sans-serif;color:var(--sub);text-shadow:0 1px 3px rgba(0,0,0,.7)}
.screen .cap i{font-style:italic}
.screen .play{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#111;display:grid;place-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
.sl{display:grid;gap:4px}
.sl .top{display:flex;justify-content:space-between;font-size:13px;font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .2s}
.conn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.conn:first-child{border-top:0}
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tcard{border:2px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:8px;text-align:left;display:grid;gap:6px}
.tcard[aria-pressed=true]{border-color:var(--accent)}
.sw{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.1)}
.sw i{flex:1}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chk{display:flex;gap:10px;align-items:flex-start}
.chk input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.tab-bar{display:none}
@media (max-width:1000px){.grid5{grid-template-columns:repeat(3,minmax(0,1fr))}.studio{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{display:none}
  .main{padding-bottom:90px}
  .tab-bar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(66px,1fr);overflow-x:auto;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
  .tab-bar button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 2px}
  .tab-bar button[aria-current=page]{color:var(--accent)}
  .tab-bar svg{width:22px;height:22px}
  .grid5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.themes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .conn{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes sh{from{background-position:0 0}to{background-position:200% 0}}
.fxw{position:absolute;inset:0}
.ov{position:absolute;inset:0;pointer-events:none}
.ov.flash{background:#fff;opacity:0}
.ov.glitch{opacity:0;background:linear-gradient(transparent 20%,rgba(255,0,70,.35) 20% 26%,transparent 26% 52%,rgba(0,220,255,.35) 52% 57%,transparent 57% 80%,rgba(255,0,70,.3) 80% 84%,transparent 84%);mix-blend-mode:screen}
.ov.scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
.ov.grain{opacity:.16;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");mix-blend-mode:overlay}
.ov.box{background:linear-gradient(#000 0 9%,transparent 9% 91%,#000 91%)}
.callout{position:absolute;left:5%;top:9%;font:700 clamp(11px,2vw,16px) 'Poppins',sans-serif;letter-spacing:.12em;color:#fff;background:rgba(10,14,25,.65);border-left:3px solid var(--sub);padding:3px 10px;border-radius:3px}
.screen.playing .pic{animation:drift 6s ease-in-out infinite alternate}
.screen.playing.g-shake .fxw{animation:kshake 3s linear infinite}
.screen.playing.g-punch .pic{animation:kpunch 3s ease-out infinite}
.screen.playing.g-flash .ov.flash{animation:kflash 3s linear infinite}
.screen.playing.g-glitch .ov.glitch{animation:kglitch 3s steps(1) infinite}
@keyframes drift{to{transform:scale(1.05)}}
@keyframes kshake{0%,19%,31%,100%{transform:none}20%{transform:translate(calc(var(--sh)*-1px),calc(var(--sh)*.5px))}22%{transform:translate(calc(var(--sh)*1px),calc(var(--sh)*-.6px))}24%{transform:translate(calc(var(--sh)*-.7px),calc(var(--sh)*-.4px))}26%{transform:translate(calc(var(--sh)*.6px),calc(var(--sh)*.5px))}28%{transform:translate(calc(var(--sh)*-.3px),0)}}
@keyframes kpunch{0%,19%{transform:scale(1)}20%{transform:scale(calc(1 + var(--pz)))}34%,100%{transform:scale(1)}}
@keyframes kflash{0%,19%{opacity:0}20%{opacity:.55}30%,100%{opacity:0}}
@keyframes kglitch{0%,19%{opacity:0}20%{opacity:1;transform:translateX(-6px)}22%{opacity:.8;transform:translateX(7px)}24%{opacity:1;transform:translateX(-3px)}26%,100%{opacity:0;transform:none}}

/* ---- visual upgrade ---- */
a{color:var(--accent);font-weight:500}
#app{min-height:100%}
body{background:radial-gradient(900px 520px at 88% -8%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 62%),radial-gradient(700px 420px at -8% 18%,color-mix(in srgb,var(--thumb2) 28%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#7C3AED));box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 32%,transparent)}
.card{box-shadow:0 1px 2px rgba(20,33,61,.04),0 8px 24px rgba(20,33,61,.05)}
.clip{transition:transform .15s,box-shadow .15s}.clip:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(20,33,61,.12)}
.nav button[aria-current=page]{background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 60%,var(--surface)))}
.logo{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#38BDF8))}
.herocard{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 58%,#7C3AED));color:#fff;border:0;position:relative;overflow:hidden}
.herocard:before{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14)}
.herocard:after{content:"";position:absolute;right:70px;bottom:-90px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.09)}
.herocard>*{position:relative;z-index:1}
.herocard .ht{font-size:20px;color:#fff}.herocard .hs,.herocard .muted{color:rgba(255,255,255,.85)}
.herocard label.f{color:#fff}
.herocard .btn.primary{background:#fff;color:var(--accent);box-shadow:none}
html[data-app-theme="dark"] .herocard{background:linear-gradient(135deg,#27324A,#1A1B1E);border:1px solid var(--line);color:var(--ink)}
html[data-app-theme="dark"] .herocard .ht,html[data-app-theme="dark"] .herocard label.f{color:var(--ink)}
html[data-app-theme="dark"] .herocard .hs,html[data-app-theme="dark"] .herocard .muted{color:var(--muted)}
html[data-app-theme="dark"] .herocard .btn.primary{background:var(--accent);color:var(--accent-ink)}
/* password eye */
.pw{position:relative;display:block;width:100%}
.pw input{padding-right:48px!important}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:38px;height:38px;display:grid;place-items:center;color:var(--muted);border-radius:8px;padding:0}
.eye:hover{color:var(--accent);background:var(--accent-soft)}
.eye svg{width:20px;height:20px}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-hero{position:relative;overflow:hidden;color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 78%,#0B1030),var(--accent) 52%,var(--thumb2))}
html[data-app-theme="dark"] .auth-hero{background:linear-gradient(145deg,#141A2B,#26324E 55%,#31507F);color:#E8E9EB}
.auth-hero:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-120px;top:-120px;background:rgba(255,255,255,.12)}
.auth-hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;left:-90px;bottom:-100px;background:rgba(255,255,255,.09)}
.auth-hero>*{position:relative;z-index:1}
.auth-hero .brand{color:#fff}
.auth-hero h2{font-size:32px;line-height:1.2;font-weight:700;max-width:14em}
.auth-hero p{margin:14px 0 0;opacity:.88;max-width:30em;font-size:15px}
.auth-hero ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.auth-hero li{display:flex;gap:10px;align-items:center;font-weight:500}
.auth-hero li i{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-style:normal;font-size:12px}
.mock{position:relative;height:200px;margin-top:30px}
.mc{position:absolute;width:190px;aspect-ratio:16/10;border-radius:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);backdrop-filter:blur(8px);animation:float 6s ease-in-out infinite;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:7px}
.mc:before{content:"";position:absolute;inset:0;margin:auto;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92)}
.mc:after{content:"";position:absolute;left:50%;top:50%;margin:-8px 0 0 -5px;border-left:14px solid var(--accent);border-top:8px solid transparent;border-bottom:8px solid transparent;transform:translateX(0)}
.mc em{position:absolute;left:10px;top:10px;font:700 10px/1 'Poppins',sans-serif;letter-spacing:.1em;background:rgba(255,255,255,.92);color:var(--accent);border-radius:99px;padding:4px 8px}
.mc b{display:block;height:6px;border-radius:99px;background:rgba(255,255,255,.75);width:72%}.mc b.s{width:42%;opacity:.6}
.m1{left:0;top:30px}.m2{left:150px;top:0;animation-delay:-2s}.m3{left:300px;top:60px;animation-delay:-4s}
@keyframes float{50%{transform:translateY(-10px)}}
.auth-form{display:flex;align-items:center;justify-content:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.auth-box{width:100%;max-width:420px;display:grid;gap:16px}
.auth-box .card{padding:24px;box-shadow:0 18px 48px rgba(20,33,61,.12)}
@media (max-width:860px){
 .auth{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}

 .auth-hero .mock,.auth-hero .ed-wrap,.auth-hero ul,.auth-hero p{display:none}
 .auth-hero h2{font-size:21px}
 .auth-form{align-items:flex-start;padding-top:24px}
}
@media (prefers-reduced-motion:reduce){.mc{animation:none}}

/* ---- layout v2: banner, page title, boxed rail ---- */
.banner{position:relative;overflow:hidden;border-radius:20px;padding:26px 20px;text-align:center;color:#fff;display:grid;justify-items:center;gap:6px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 80%,#0B1030),var(--accent) 55%,var(--thumb2));box-shadow:0 14px 34px color-mix(in srgb,var(--accent) 30%,transparent)}

.banner:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-70px;top:-110px;background:rgba(255,255,255,.13)}

function connectedPost(){var r=catalog().filter(function(m){return m.kind!=="edit"&&S.mcp[m.id]&&S.mcp[m.id].on});Object.keys(S.mcp).forEach(function(id){var o=S.mcp[id];if(o&&o.custom&&o.on&&o.kind!=="edit")r.push({id:id,name:o.name,desc:{en:o.url,ms:o.url}})});return r}

 if(src)return '<span class="'+c+' img" data-l="'+l+'" style="--ml:hsl('+hue+' 55% 45%)"><img src="'+esc(src)+'" alt="'+esc(n)+'" onerror="var p=this.parentNode;p.classList.remove(\'img\');p.textContent=p.getAttribute(\'data-l\')"></span>';

function b64u(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return b64u(a)}
function jget(url){return fetch(url,{headers:{Accept:"application/json"}}).then(function(r){if(!r.ok)throw new Error("http"+r.status);return r.json()})}
function firstOk(urls){var p=Promise.reject(new Error("none"));urls.forEach(function(u){p=p.catch(function(){return jget(u)})});return p}
async function startOAuth(m){
 var u=new URL(m.mcpUrl),path=u.pathname!=="/"?u.pathname:"",pr=null;
 try{pr=await firstOk([u.origin+"/.well-known/oauth-protected-resource"+path,u.origin+"/.well-known/oauth-protected-resource"])}catch(e){}
 var au=new URL(safeUrl(m.authServer)||(pr&&pr.authorization_servers&&pr.authorization_servers[0])||u.origin),ap=au.pathname!=="/"?au.pathname:"";
 var meta=await firstOk([au.origin+"/.well-known/oauth-authorization-server"+ap,au.origin+"/.well-known/oauth-authorization-server"]);
 var ru=location.origin+"/oauth-callback.html",key="se_oc_"+m.id,c=null;
 try{c=JSON.parse(localStorage.getItem(key)||"null")}catch(e){}
 if(!meta.registration_endpoint){
  if(meta.client_id_metadata_document_supported)c={client_id:location.origin+"/oauth-client.json",redirect:ru,as:meta.issuer};
  else throw new Error("noreg")}
 else if(!(c&&c.redirect===ru&&c.as===meta.issuer)){
  var r=await fetch(meta.registration_endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({client_name:BN(),redirect_uris:[ru],grant_types:["authorization_code","refresh_token"],response_types:["code"],token_endpoint_auth_method:"none"})});
  if(!r.ok)throw new Error("register"+r.status);var j=await r.json();c={client_id:j.client_id,redirect:ru,as:meta.issuer};
  try{localStorage.setItem(key,JSON.stringify(c))}catch(e){}}
 var verifier=rnd(48),state=rnd(16),chal=b64u(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
 sessionStorage.setItem("se_oauth",JSON.stringify({id:m.id,name:m.name,verifier:verifier,state:state,client:c.client_id,token:meta.token_endpoint,mcp:m.mcpUrl,redirect:ru}));
 var q=new URLSearchParams({response_type:"code",client_id:c.client_id,redirect_uri:ru,code_challenge:chal,code_challenge_method:"S256",state:state,resource:m.mcpUrl});
 if(m.scopes)q.set("scope",m.scopes);
 location.href=meta.authorization_endpoint+(meta.authorization_endpoint.indexOf("?")>-1?"&":"?")+q.toString()}
function consumeOAuth(){var r=null;try{r=JSON.parse(sessionStorage.getItem("se_oauth_result")||"null");sessionStorage.removeItem("se_oauth_result")}catch(e){}
 if(!r)return false;
 if(r.ok){S.mcp[r.id]={on:true,mode:"oauth",exp:r.exp||0,mcp:r.mcp};
  try{if(FB_ON&&FB()&&FB().saveToken)FB().saveToken(r.id,{access:r.access,refresh:r.refresh,exp:r.exp,mcp:r.mcp}).catch(function(){})}catch(e){}
  save();S.flash={ok:true,name:r.name||r.id}}
 else S.flash={ok:false,msg:t("oauthFail")};
 return true}
function flashHtml(){var f=S.flash;if(!f)return"";return f.ok?'<div class="alert-ok" role="status">✓ '+fmt2(t("oauthOk"),{n:esc(f.name)})+'</div>':'<div class="alert-red" role="alert">'+esc(f.msg)+'</div>'}
function modalHtml(){var m=mcpById(S.authFor);if(!m)return"";var a=m.auth||"apikey",o=S.mcp[m.id]||{},oauth=a==="oauth"||a==="both",key=a==="apikey"||(a==="both"&&S.mKey);
 var h='<div class="modal" id="mback"><div class="mbox" role="dialog" aria-modal="true"><div class="mlogos">'+(logoCustom()?'<span class="mlogo app">'+esc(logoCustom())+'</span>':'<img class="mlogo app-img" src="assets/logo.webp" alt="">')+'<span class="mlink">⇄</span>'+logoHtml(m)+'</div><div style="text-align:center"><h2>'+t("authorize")+' '+esc(m.name)+'</h2><p class="muted" style="margin:6px 0 0">'+fmt2(t("wantsConnect"),{app:esc(BN()),n:esc(m.name)})+'</p>'+(L10(m.note)?'<p class="small" style="margin:8px 0 0;color:var(--ink)">'+esc(L10(m.note))+'</p>':'')+(safeUrl(m.mcpUrl)?'<div class="small muted" style="margin-top:8px;word-break:break-all">MCP: '+esc(m.mcpUrl)+'</div>':'')+'</div>';
 var hasAuth=!!(safeUrl(m.mcpUrl)||safeUrl(m.authUrl));
 if(oauth){h+='<button class="btn dark block" id="m_auth">'+fmt2(t("authBy"),{n:esc(m.name)})+'</button>';
  h+=hasAuth?'<div class="small muted" style="text-align:center">'+fmt2(t("redirectNote"),{n:esc(m.name)})+(limitText(m)?'<br>'+t("freeBadge")+': '+esc(limitText(m)):'')+'</div>':'<div class="small" style="text-align:center;color:var(--bad)">'+t("noAuthUrl")+'</div>';
  if(a==="both"&&!S.mKey)h+='<div class="sep">'+t("or")+'</div><button class="btn block" id="m_showkey">'+t("paidPlan")+'</button>'}
 if(key){if(a==="apikey")h+='<div class="small muted" style="text-align:center">'+t("needKeyFirst")+'</div>';
  h+='<label class="f">'+esc(m.keyLabel||t("apiKey"))+'<input id="m_key" type="password" autocomplete="off" value="'+esc(o.key||"")+'"></label><button class="btn dark block" id="m_conn"'+((o.key||"").trim()?'':' disabled')+'>'+t("connect")+'</button>';
  if(safeUrl(m.keyUrl))h+='<a class="small" style="text-align:center" href="'+esc(safeUrl(m.keyUrl))+'" target="_blank" rel="noopener">'+t("docs")+' →</a>'}
 if(safeUrl(m.signupUrl))h+='<a class="small" style="text-align:center;font-weight:600" href="'+esc(safeUrl(m.signupUrl))+'" target="_blank" rel="noopener">'+fmt2(t("signup"),{n:esc(m.name)})+' ↗</a>';
 return h+'<div class="err" id="m_err" style="text-align:center"></div><button class="btn block" id="m_close">'+t("cancel")+'</button></div></div>'}
function bindModal(){var m=mcpById(S.authFor);if(!m)return;
 var close=function(){S.authFor=null;S.mKey=false;render()};
 $("#m_close").onclick=close;$("#mback").onclick=function(e){if(e.target.id==="mback")close()};
 var au=$("#m_auth");if(au)au.onclick=async function(){var er=$("#m_err");er.textContent="";
  if(safeUrl(m.mcpUrl)){var lab=au.textContent;au.disabled=true;au.textContent=fmt2(t("opening"),{n:m.name});
   try{await startOAuth(m)}catch(e){au.disabled=false;au.textContent=lab;er.textContent=fmt2(t("discoverFail"),{n:m.name})}return}
  var url=safeUrl(m.authUrl);if(!url){er.textContent=t("noAuthUrl");return}
  var st=rnd(12),go=url.indexOf("{state}")>-1?url.replace("{state}",st):url+(url.indexOf("?")>-1?"&":"?")+"state="+st;
  S.mcp[m.id]=Object.assign({},S.mcp[m.id],{on:false,pending:true,mode:"oauth",nonce:st});S.authFor=null;save();location.href=go};
 var sk=$("#m_showkey");if(sk)sk.onclick=function(){S.mKey=true;render()};

  S.mcp[m.id]=Object.assign({},S.mcp[m.id],{on:true,pending:false,mode:"key",key:k});save();
