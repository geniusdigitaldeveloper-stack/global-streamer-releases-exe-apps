<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Streamer Editor Admin</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#F4F7FB;--surface:#fff;--ink:#14213D;--muted:#5B6B82;--line:#DDE4EE;--accent:#1F5FBF;--ok:#1E8E5A;--bad:#C0392B;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;overflow-wrap:anywhere}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
h1{font-size:20px;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
input,select,button{font:inherit;border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;min-height:40px;background:var(--surface);color:var(--ink)}
input{width:100%}
button{cursor:pointer;font-weight:500}.p{background:var(--accent);border-color:var(--accent);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stats b{display:block;font-size:22px}
.muted{color:var(--muted)}.err{color:var(--bad);min-height:20px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;background:#E3F3EA;color:var(--ok)}.pill.off{background:#FBE5E2;color:var(--bad)}
.login{max-width:380px;margin:8vh auto 0;display:grid;gap:12px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
 <div class="card login" id="login">
  <h1>Admin Streamer Editor</h1>
  <input id="em" type="email" placeholder="E-mel" autocomplete="email">
  <input id="pw" type="password" placeholder="Kata laluan" autocomplete="current-password">
  <div class="err" id="err"></div>
  <button class="p" id="go">Log masuk</button>
  <button id="g">Log masuk dengan Google</button>
 </div>
 <div id="panel" hidden>
  <div class="card row"><div><h1>Admin Streamer Editor</h1><div class="muted" id="me"></div></div><button id="out">Log keluar</button></div>
  <div class="stats" id="stats" style="margin-top:16px"></div>
  <div class="card" style="margin-top:16px;display:grid;gap:12px"><input id="q" type="search" placeholder="Cari e-mel"><div class="tw"><table><thead><tr><th>E-mel</th><th>Pelan</th><th>Status</th><th>Daftar</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="err" id="err2"></div></div>
 </div>
</div>
<script src="../firebase-config.js"></script>
<script type="module">
const cfg = window.FIREBASE_CONFIG, B = "https://www.gstatic.com/firebasejs/10.12.2/";
const { initializeApp } = await import(B + "firebase-app.js");
const A = await import(B + "firebase-auth.js");
const F = await import(B + "firebase-firestore.js");
const app = initializeApp(cfg), auth = A.getAuth(app), db = F.getFirestore(app);
const $ = (i) => document.getElementById(i);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let users = [];
const bad = (m) => { $("err").textContent = m; };

$("go").onclick = () => A.signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value).catch(() => bad("E-mel atau kata laluan salah."));
$("g").onclick = () => { const p = new A.GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" }); A.signInWithPopup(auth, p).catch(() => bad("Log masuk Google gagal.")); };
$("out").onclick = () => A.signOut(auth);
$("q").oninput = draw;

A.onAuthStateChanged(auth, async (u) => {
  $("login").hidden = !!u; $("panel").hidden = true;
  if (!u) return;
  let isAdmin = false;
  try { isAdmin = (await F.getDoc(F.doc(db, "admins", u.uid))).exists(); } catch (_) {}
  if (!isAdmin) { await A.signOut(auth); $("login").hidden = false; bad("Akaun ini bukan admin."); return; }
  $("me").textContent = u.email; $("panel").hidden = false; bad("");
  F.onSnapshot(F.collection(db, "users"), (snap) => { users = snap.docs.map((d) => ({ id: d.id, ...d.data() })); draw(); }, () => { $("err2").textContent = "Tidak dapat baca senarai pengguna."; });
});

function draw() {
  const q = $("q").value.trim().toLowerCase();
  const n = (f) => users.filter(f).length;
  $("stats").innerHTML = [["Jumlah pengguna", users.length], ["Aktif", n((x) => x.status !== "disabled")], ["Dilumpuhkan", n((x) => x.status === "disabled")], ["Pelan Pro", n((x) => x.plan === "pro")]]
    .map((s) => `<div class="card"><span class="muted">${s[0]}</span><b>${s[1]}</b></div>`).join("");
  const rows = users.filter((x) => !q || (x.email || "").toLowerCase().includes(q)).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  $("rows").innerHTML = rows.map((x) => {
    const off = x.status === "disabled";
    return `<tr><td>${esc(x.email)}</td><td><select data-plan="${x.id}"><option value="free"${x.plan !== "pro" ? " selected" : ""}>Free</option><option value="pro"${x.plan === "pro" ? " selected" : ""}>Pro</option></select></td><td><span class="pill${off ? " off" : ""}">${off ? "Dilumpuhkan" : "Aktif"}</span></td><td>${x.createdAt ? new Date(x.createdAt.seconds * 1000).toLocaleDateString() : ""}</td><td><button data-tog="${x.id}" data-to="${off ? "active" : "disabled"}">${off ? "Aktifkan" : "Lumpuhkan"}</button></td></tr>`;
  }).join("") || `<tr><td colspan="5" class="muted">Belum ada pengguna.</td></tr>`;
  document.querySelectorAll("[data-plan]").forEach((s) => { s.onchange = () => upd(s.dataset.plan, { plan: s.value }); });
  document.querySelectorAll("[data-tog]").forEach((b) => { b.onclick = () => upd(b.dataset.tog, { status: b.dataset.to }); });
}
function upd(id, d) { $("err2").textContent = ""; F.updateDoc(F.doc(db, "users", id), d).catch(() => { $("err2").textContent = "Gagal kemas kini."; }); }
</script>
</body>
</html>
